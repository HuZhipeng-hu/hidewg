# HideWG nginx 反向代理配置
# 将外部 WSS (TLS 1.3) 请求转发到本地 HideWG 服务的 WS (明文) 端口
#
# 部署方式:
#   1. 将此文件复制到服务器 /etc/nginx/sites-available/hidewg.conf
#   2. sudo ln -s /etc/nginx/sites-available/hidewg.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 证书: 使用 Let's Encrypt 或自签名证书
#   certbot --nginx -d your-domain.com
#   或: ./hidewg cert --cn your-domain.com --output-dir /etc/nginx/ssl/

upstream hidewg_backend {
    server 127.0.0.1:8443;  # HideWG 服务端监听的 WS 端口
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 替换为实际域名或 IP

    # TLS 证书 (Let's Encrypt 或自签名)
    ssl_certificate     /etc/nginx/ssl/server.pem;
    ssl_certificate_key /etc/nginx/ssl/server-key.pem;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # WebSocket 反向代理
    location /ws {
        proxy_pass http://hidewg_backend;
        proxy_http_version 1.1;

        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递客户端真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置 (长连接)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 关闭缓冲 (实时传输)
        proxy_buffering off;
    }

    # 其他请求返回伪装页面
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
