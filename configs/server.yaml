# Example server-side HideWG proxy config.
# Point the server WireGuard peer endpoint to 127.0.0.1:51831.
shared_secret: 661eacbc95a3016cd2c5e91361a303f6
session_id: 0x48445747

inner_listen_host: 127.0.0.1
inner_listen_port: 51831

outer_listen_host: 0.0.0.0
outer_listen_port: 55821
# 客户端在 NAT 后面，启动后会自动学习客户端的真实地址
peer_host: 127.0.0.1
peer_port: 55820

wireguard_host: 127.0.0.1
wireguard_port: 51820

max_fragment_payload: 1300
# 填充桶覆盖 HTTPS 典型包长范围，包含 1400B 大包
padding_buckets: [60, 90, 128, 256, 512, 768, 1024, 1280, 1400]
padding_jitter_chance: 0.20
timing_jitter_ms: 0.5

# 反深度学习防御
# 填充模式: "mimicry" (流量模拟，推荐) / "adaptive" (桶+自适应)
padding_mode: mimicry
mimicry_jitter_std: 8.0

# ===== AmneziaWG 借鉴的反检测增强 =====

# 垃圾包注入（AmneziaWG Jc/Jmin/Jmax）
# 在会话首次发送前注入随机垃圾包，打乱握手特征
junk_count: 3
junk_min_size: 64
junk_max_size: 384

# S4 关闭：让填充精确命中目标桶，不额外偏移
noise_prefix_min: 0
noise_prefix_max: 0
s4_padding_max: 0

# 掩护流量：服务器高速率发大包（模拟 HTTPS 下载响应，真实 HTTPS 入站占比 ~75%）
cover_traffic: true
cover_rate_hz: 1.5
cover_burst_max: 5
cover_bidirectional: true

# ===== 传输层 =====
# WebSocket-over-TLS + nginx 反代：Wireshark 看到标准 HTTPS 流量
# 客户端 → WSS (TLS 1.3) → nginx:443 → WS (明文) → HideWG:8443
outer_listen_port: 8443
tls_certfile: .hidewg/tls/server.pem
tls_keyfile: .hidewg/tls/server-key.pem
# nginx 已做 TLS 终止，HideWG 收到的是明文 HTTP/WS
tls_terminate: true

state_path: .hidewg/server_state.json
log_path: .hidewg/server_runtime.jsonl
pid_path: .hidewg/server.pid
